<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="台湾グルメを料理名や説明文から検索できるミニガイド。">
<title>台湾グルメ検索 | TAIPEI CITY GUIDE</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #fff;
    --surface: #fff;
    --text: #252727;
    --muted: #777f7d;
    --border: #e7ebe9;
    --soft: #f6f8f7;
    --accent: #237c60;
    --accent-faint: #eaf5ef;
    --focus: #9bd9c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #191a1a;
      --surface: #252727;
      --text: #f0f2f0;
      --muted: #aab0ac;
      --border: #393d3a;
      --soft: #2d312e;
      --accent: #83d3b0;
      --accent-faint: #233c30;
      --focus: #4bbf8b;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 10px 8px 16px;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.55;
  }
  main {
    width: min(100%, 740px);
    margin: 0 auto;
    padding: clamp(17px, 4vw, 28px);
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
  }
  .kicker { font-size: 10px; letter-spacing: .17em; color: var(--accent); font-weight: 750; margin: 0 0 8px; }
  h1 { font-size: clamp(20px, 4.8vw, 27px); line-height: 1.3; margin: 0 0 6px; font-weight: 760; }
  .intro { font-size: 12px; color: var(--muted); margin: 0 0 19px; }
  .search-shell {
    display: flex; align-items: center; gap: 10px;
    padding: 0 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--soft);
    transition: border-color .15s, box-shadow .15s;
  }
  .search-shell:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint); }
  .search-svg { display: block; color: var(--muted); width: 20px; height: 20px; flex-shrink: 0; }
  input {
    min-width: 0; width: 100%; height: 49px;
    border: 0; outline: none; padding: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--text);
    appearance: none;
  }
  input::placeholder { color: var(--muted); opacity: .9; }
  input::-webkit-search-cancel-button { display: none; }
  .clear {
    display: none; width: 30px; height: 30px; flex-shrink: 0;
    border: none; border-radius: 50%; background: var(--border);
    font-size: 17px; color: var(--muted); cursor: pointer;
  }
  .clear.visible { display: inline-grid; place-items: center; }
  .clear:focus-visible, .pill:focus-visible, .quick button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .quick button {
    font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 30px; cursor: pointer;
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 11px; }
  .pill {
    border: 1px solid var(--border); background: var(--soft);
    border-radius: 100px; padding: 7px 10px;
    cursor: pointer; color: var(--text); font: inherit;
    font-size: 12px; transition: background .15s, border-color .15s;
  }
  .pill.active { background: var(--accent-faint); color: var(--accent); border-color: var(--accent); font-weight: 650; }
  .pill-count { opacity: .75; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .results-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
  .results-head h2 { margin: 0; font-size: 13px; font-weight: 750; }
  .result-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { padding: 32px 10px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty .emoji { font-size: 24px; display: block; margin-bottom: 7px; }
  .result { display: flex; align-items: start; justify-content: space-between; gap: 10px; padding: 13px 2px; border-bottom: 1px solid var(--border); }
  .result:last-child { border-bottom: 0; }
  .dish { margin: 0 0 3px; font-weight: 725; font-size: 15px; line-height: 1.4; }
  .desc { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .tag { white-space: nowrap; font-size: 10px; padding: 3px 6px; border-radius: 6px; color: var(--muted); background: var(--soft); margin-top: 3px; }
  /* 右側：等級分類＋辣度 */
.result-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

/* 辣度 Emoji */
.spice {
  font-size: 9px;
  line-height: 1.4;
  white-space: nowrap;
}

/* 可能會辣：虛線外框 */
.spice.maybe {
  border: 1px dashed #A75E48;
  border-radius: 5px;
  padding: 3px 4px;
}
  mark { background: #365E4B; color: #FFFFFF; border-radius: 2px; padding: 0 1px; }
  /* Mobile: display 3.3 rows; desktop: display 3 rows. */
  #results.scrolling {
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) var(--soft);
    overscroll-behavior: contain;
  }
  #results.scrolling::-webkit-scrollbar { width: 7px; }
  #results.scrolling::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 8px; }
  /* Keep scroll guidance and optional spicy-food legend on one compact line. */
  .scroll-tip {
    font-size: 10px;
    margin: 4px 2px 0;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 3px 9px;
    text-align: center;
  }
  .scroll-tip[hidden], .spice-caption[hidden], #scroll-text[hidden] { display: none; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin: 10px 0 0; }
  @media (max-width: 420px) {
    main { border-radius: 12px; padding: 17px 13px 10px; }
    .tag { font-size: 9px; }
    .result { gap: 5px; }
    .pill { font-size: 11px; padding: 7px 9px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="kicker">TAIPEI CITY GUIDE · FOOD INDEX</p>
  <h1>🔍 台湾グルメを探す</h1>
  <p class="intro">料理名から検索。中国語・日本語表記ゆれにも対応！</p>
  <label class="search-shell" for="search">
    <svg class="search-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg>
    <input id="search" type="search" disabled autocomplete="off" spellcheck="false" placeholder="例：肉、豚、とり、🥤" aria-label="料理を検索">
    <button class="clear" id="clear" type="button" aria-label="検索をクリア">×</button>
  </label>
  <div class="quick" aria-label="おすすめ検索">
    <span>人気タグ</span>
    <button type="button" data-example="🐔" aria-label="鶏を検索">🐔</button>
    <button type="button" data-example="🍚" aria-label="ご飯を検索">🍚</button>
    <button type="button" data-example="🍜" aria-label="麺類を検索">🍜</button>
    <button type="button" data-example="🦐" aria-label="エビ料理を検索">🦐</button>
    <button type="button" data-example="🍪" aria-label="お菓子を検索">🍪</button>
  </div>
  <nav class="filters" id="filters" aria-label="カテゴリーフィルター"></nav>
  <section aria-labelledby="list-title">
    <header class="results-head">
      <h2 id="list-title">料理一覧</h2>
      <span class="result-count" id="result-count" role="status" aria-live="polite"></span>
    </header>
    <div id="results" role="region" aria-label="料理の検索結果" tabindex="0"><div class="empty">料理データを読み込んでいます…</div></div>
    <p id="scroll-tip" class="scroll-tip" hidden>
      <span id="scroll-text">↓ スクロールして続きを見る</span>
    </p>
  </section>
  <p class="foot">台湾グルメ全<span id="total-food-count">—</span>品</p>
</main>
<script>
"use strict";
// The content is managed separately in foods.csv and synonyms.json.
// Keep both files in the same folder as this index.html on GitHub Pages.
// CSV row order is preserved within each category; categories remain in the fixed order below.
let foods = [];
let synonymGroups = [];
let normalizedGroups = [];

const cats = ["すべて", "🔰 初心者", "🏮 地元民", "⚔️ クセ強", "💀 限界突破"];
const input = document.querySelector("#search");
const clear = document.querySelector("#clear");
const filters = document.querySelector("#filters");
const results = document.querySelector("#results");
const count = document.querySelector("#result-count");
const scrollTip = document.querySelector("#scroll-tip");
const scrollText = document.querySelector("#scroll-text");
const footerCount = document.querySelector("#total-food-count");
let selected = cats[0];

const normalized = s => String(s).normalize("NFKC").toLocaleLowerCase();

// Synonym groups are loaded from synonyms.json, then normalized for searching.
function variantsFor(term) {
  const group = normalizedGroups.find(group => group.includes(term));
  return group || [term];
}
function searchTerms() {
  return normalized(input.value.trim()).split(/\s+/).filter(Boolean);
}

function currentMatches() {
  const terms = searchTerms();

  return foods.filter(food => {
    // The difficulty filter still applies to all searches.
    if (selected !== cats[0] && food.category !== selected) return false;

    // Include hidden tags so partial Japanese words and emoji can be searched.
    const text = normalized(
      `${food.name} ${food.description} ${food.category} ${(food.tags || []).join(" ")}`
    );

    return terms.every(term => {
      // One pepper (or 辛い) finds all marked spicy dishes, including "maybe".
      // Two/three peppers require at least that numerical spice level.
      const peppers = term.match(/🌶️/gu) || [];
      if (peppers.length && peppers.join("") === term) {
        return peppers.length === 1
          ? Boolean(food.spice)
          : peppers.length <= 3 && Number(food.spice) >= peppers.length;
      }
      if (term === "辛い") return Boolean(food.spice);

      // Preserve the existing traditional/simplified/Japanese synonym groups.
      return variantsFor(term).some(alias => text.includes(alias));
    });
  });
}

function addHighlightedText(parent, value, terms) {
  // Uses DOM text nodes, not HTML interpolation, to keep all inputs safe.
  const original = String(value);
  const normalizedValue = normalized(original);
  let ranges = [];
  for (const term of terms) {
    if (!term) continue;
    let start = 0;
    while (start < normalizedValue.length) {
      const index = normalizedValue.indexOf(term, start);
      if (index < 0) break;
      // NFKC generally preserves positions for these CJK terms; if not, skip highlighting safely.
      if (original.slice(index, index + term.length) &&
          normalized(original.slice(index, index + term.length)) === term) {
        ranges.push([index, index + term.length]);
      }
      start = index + Math.max(term.length, 1);
    }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let last = 0;
  for (const [start, end] of ranges) {
    if (start < last) continue;
    parent.append(document.createTextNode(original.slice(last, start)));
    const mark = document.createElement("mark");
    mark.textContent = original.slice(start, end);
    parent.append(mark);
    last = end;
  }
  parent.append(document.createTextNode(original.slice(last)));
}
function drawFilters() {
  filters.replaceChildren();
  for (const cat of cats) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `pill${selected === cat ? " active" : ""}`;
    button.setAttribute("aria-pressed", String(selected === cat));
    const label = document.createElement("span");
    label.textContent = cat;
    const n = document.createElement("span");
    n.className = "pill-count";
    n.textContent = ` ${cat === cats[0] ? foods.length : foods.filter(f => f.category === cat).length}`;
    button.append(label, n);
    button.addEventListener("click", () => {
      selected = cat;
      drawFilters();
      drawResults();
    });
    filters.append(button);
  }
}
function resizeResultViewport() {
  const rows = [...results.querySelectorAll(".result")];
  const mobile = window.matchMedia("(max-width: 600px)").matches;
  // Change 3.3 to 3.1 or 3.5 to fine-tune the mobile result window.
  const visibleRows = mobile ? 3.3 : 3;
  const fullRows = Math.floor(visibleRows);
  const needsScroll = rows.length > fullRows;
  results.classList.toggle("scrolling", needsScroll);
  scrollText.hidden = !needsScroll;
  // Show the compact dashed-pepper explanation only when relevant.
  scrollTip.hidden = !needsScroll;
  if (!needsScroll) {
    results.style.maxHeight = "none";
    return;
  }
  // Measure actual rendered rows, including Japanese text wrapping.
  // Show three full rows plus 30% of the fourth on mobile.
  const fullHeight = rows.slice(0, fullRows).reduce((sum, row) => sum + row.getBoundingClientRect().height, 0);
  const nextHeight = rows[fullRows]?.getBoundingClientRect().height ?? 0;
  const fraction = visibleRows - fullRows;
  results.style.maxHeight = `${Math.ceil(fullHeight + nextHeight * fraction)}px`;
}

function drawResults() {
  const matched = currentMatches();
  count.textContent = `${matched.length} 件`;
  results.replaceChildren();
  results.style.maxHeight = "none";
  results.classList.toggle("scrolling", matched.length > (window.matchMedia("(max-width: 600px)").matches ? 2 : 3));
  const terms = searchTerms();
  // Include alternative spellings when highlighting an equivalent match.
  const highlightTerms = [...new Set(terms.flatMap(variantsFor))];
  if (!matched.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    const face = document.createElement("span");
    face.className = "emoji";
    face.textContent = "🔎";
    const message = document.createElement("span");
    message.textContent = "該当する料理が見つかりません。料理名・🍜・シーフードなどで検索してください。";
    empty.append(face, message);
    results.append(empty);
  } else {
    for (const food of matched) {
      const row = document.createElement("article");
      row.className = "result";
      const left = document.createElement("div");
      const name = document.createElement("h3");
      name.className = "dish";
      const desc = document.createElement("p");
      desc.className = "desc";
      addHighlightedText(name, food.name, highlightTerms);
      addHighlightedText(desc, food.description, highlightTerms);
      left.append(name, desc);
      
const meta = document.createElement("div");
meta.className = "result-meta";

// 原本的等級分類
const tag = document.createElement("span");
tag.className = "tag";
tag.textContent = food.category;
meta.append(tag);

// 辣度：沒有設定就不顯示
if (food.spice) {
  const spice = document.createElement("span");

  const isMaybe = food.spice === "maybe";

  spice.className = isMaybe
    ? "spice maybe"
    : "spice";

  spice.textContent = isMaybe
    ? "🌶️"
    : "🌶️".repeat(Number(food.spice));

  const label = isMaybe
    ? "お店によって辛い場合があります"
    : `辛さの目安：${food.spice} / 3`;

  spice.setAttribute("aria-label", label);
  spice.title = label;

  meta.append(spice);
}

row.append(left, meta);

      results.append(row);
    }
  }
  results.scrollTop = 0;
  resizeResultViewport();
}
function onSearch() {
  clear.classList.toggle("visible", input.value.length > 0);
  drawResults();
}
input.addEventListener("input", onSearch);
clear.addEventListener("click", () => { input.value = ""; onSearch(); input.blur(); });
document.querySelectorAll("[data-example]").forEach(button => {
  button.addEventListener("click", () => {
    input.value = button.dataset.example;
    onSearch();
    input.blur();
  });
});
window.addEventListener("resize", () => requestAnimationFrame(resizeResultViewport));

// Minimal CSV parser: supports UTF-8 BOM, quoted commas, quotes, and newlines.
function parseCsv(text) {
  const content = text.replace(/^\uFEFF/, "");
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < content.length; i++) {
    const char = content[i];
    if (char === '"') {
      if (inQuotes && content[i + 1] === '"') { field += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (char === "," && !inQuotes) {
      row.push(field); field = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      row.push(field); field = "";
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      if (char === "\r" && content[i + 1] === "\n") i++;
    } else {
      field += char;
    }
  }
  if (inQuotes) throw new Error("CSV の引用符が閉じていません。");
  row.push(field);
  if (row.some(v => v.trim() !== "")) rows.push(row);
  if (!rows.length) throw new Error("foods.csv が空です。");
  const headers = rows.shift().map(h => h.trim().toLowerCase());
  for (const required of ["category", "name", "description"]) {
    if (!headers.includes(required)) throw new Error("foods.csv に列がありません: " + required);
  }
  return rows.map((values, position) => {
    const item = Object.fromEntries(headers.map((key, i) => [key, (values[i] || "").trim()]));
    if (!item.name || !cats.includes(item.category)) {
      throw new Error(`foods.csv の ${position + 2} 行目を確認してください。`);
    }
    return {
  category: item.category,
  name: item.name,
  description: item.description,
  
tags: (item.tags || "")
  .split("|")
  .map(tag => tag.trim())
  .filter(Boolean),

spice: ["1", "2", "3", "maybe"].includes(item.spice)
  ? item.spice
  : ""

};
  }).sort((a, b) => cats.indexOf(a.category) - cats.indexOf(b.category));
}

async function loadData() {
  try {
    const [foodResponse, synonymResponse] = await Promise.all([
      fetch("./foods.csv", { cache: "no-store" }),
      fetch("./synonyms.json", { cache: "no-store" })
    ]);
    if (!foodResponse.ok || !synonymResponse.ok) {
      throw new Error("foods.csv または synonyms.json が見つかりません。");
    }
    const [csvText, json] = await Promise.all([
      foodResponse.text(), synonymResponse.json()
    ]);
    const loadedFoods = parseCsv(csvText);
    if (!Array.isArray(json.groups) || !json.groups.every(group =>
        Array.isArray(group) && group.every(word => typeof word === "string"))) {
      throw new Error("synonyms.json の groups を確認してください。");
    }
    foods = loadedFoods;
    synonymGroups = json.groups;
    normalizedGroups = synonymGroups.map(group => [...new Set(group.map(normalized))]);
    footerCount.textContent = String(foods.length);
    input.disabled = false;
    drawFilters();
    onSearch();
  } catch (error) {
    console.error("TAIPEI CITY GUIDE: data load error", error);
    filters.replaceChildren();
    results.replaceChildren();
    results.classList.remove("scrolling");
    results.style.maxHeight = "none";
    scrollTip.hidden = true;
    count.textContent = "読み込みエラー";
    const notice = document.createElement("div");
    notice.className = "empty";
    notice.textContent = "データを読み込めませんでした。GitHub Pages で開き、index.html・foods.csv・synonyms.json が同じフォルダにあるか確認してください。";
    results.append(notice);
  }
}
loadData();
</script>
</body>
</html>
